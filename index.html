<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beastbound - A Creature Roguelike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1024; --bg2:#161a36; --ink:#241d3d;
  --cream:#f5ecd7; --cream2:#e6d9ba; --line:#241026;
  --gold:#ffd23e; --ember:#e8683a; --shade:#7a5fae;
  --hi:#5ac46a; --mid:#e0b53a; --lo:#e8683a;
  --shadow:0 4px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--cream);
  font-family:'Press Start 2P', ui-monospace, monospace;
  font-size:11px; line-height:1.55;
  -webkit-font-smoothing:none;
  image-rendering:pixelated;
  overflow:hidden;
  user-select:none; -webkit-user-select:none;
  touch-action:manipulation;
}
canvas{image-rendering:pixelated; image-rendering:crisp-edges;}

#app{
  position:relative;
  width:100%; height:100%;
  max-width:520px; margin:0 auto;
  background:linear-gradient(var(--bg),#0a0c1a);
  overflow:hidden;
}

/* scanlines */
#scanlines{
  pointer-events:none; position:absolute; inset:0; z-index:60;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply; opacity:.5;
}

/* screens */
.screen{
  position:absolute; inset:0;
  display:none; flex-direction:column;
  padding:16px 14px 18px;
  overflow-y:auto; overflow-x:hidden;
}
.screen.active{display:flex}
.screen::-webkit-scrollbar{width:6px}
.screen::-webkit-scrollbar-thumb{background:var(--ink)}

/* buttons */
.btn{
  font-family:inherit; font-size:10px; color:var(--ink);
  background:var(--cream); border:3px solid var(--line);
  border-radius:0; padding:11px 12px; cursor:pointer;
  box-shadow:var(--shadow); letter-spacing:.5px;
  transition:transform .04s, background .1s; line-height:1.4;
  text-align:center;
}
.btn:hover{background:#fff}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none; transform:none}
.btn-big{font-size:13px; padding:15px 18px; background:var(--gold); width:100%; max-width:320px}
.btn-ghost{background:transparent; color:var(--cream); border-color:var(--cream2)}
.btn-ghost:hover{background:rgba(245,236,215,.1)}
.btn-danger{background:var(--ember); color:#fff}
.btn-mini{font-size:9px; padding:7px 9px}

/* ---------- title ---------- */
.title-wrap{
  margin:auto; display:flex; flex-direction:column; align-items:center;
  gap:14px; text-align:center; padding:10px 0;
}
.title-beasts{display:flex; align-items:flex-end; gap:8px; margin-bottom:4px;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.4));}
.logo{
  font-size:34px; line-height:1; letter-spacing:1px;
  color:var(--gold);
  text-shadow:3px 3px 0 var(--ember), 6px 6px 0 rgba(0,0,0,.4);
}
.logo span{color:var(--cream); display:block; margin-top:6px}
.logo-dark{color:var(--ember); text-shadow:3px 3px 0 #000}
.tagline{color:var(--cream2); font-size:10px; letter-spacing:2px; margin-bottom:6px}
.foot{color:#6a668a; font-size:8px; letter-spacing:1px; margin-top:8px}

/* ---------- headings ---------- */
.scr-h{font-size:14px; color:var(--gold); text-align:center; margin-bottom:10px;
  text-shadow:2px 2px 0 rgba(0,0,0,.4); letter-spacing:1px}

/* ---------- panels ---------- */
.panel{
  background:var(--cream); color:var(--ink);
  border:3px solid var(--line); box-shadow:var(--shadow);
}

/* ---------- starter ---------- */
.starter-row{display:flex; flex-direction:column; gap:12px; margin:auto 0}
.starter-card{padding:12px; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center}
.starter-card canvas{margin-bottom:2px}
.starter-name{font-size:14px; letter-spacing:1px}
.dex{font-size:8.5px; line-height:1.6; color:#4a4360}
.sbars{width:100%; display:flex; flex-direction:column; gap:3px; margin:4px 0}
.sb-row{display:flex; align-items:center; gap:6px; font-size:8px}
.sb-row span{width:26px; color:#4a4360; text-align:right}
.sb{flex:1; height:8px; background:#d4c6a4; border:1px solid var(--line)}
.sbf{height:100%; background:var(--ember)}
.starter-card .btn{width:100%; margin-top:2px}

/* ---------- map ---------- */
.map-sky{
  border:3px solid var(--line); box-shadow:var(--shadow);
  padding:12px 12px 16px; text-align:center; margin-bottom:12px;
}
.badge-row{display:flex; justify-content:center; gap:5px; margin-bottom:8px}
.badge{color:rgba(255,255,255,.28); font-size:12px; text-shadow:0 1px 0 rgba(0,0,0,.5)}
.badge.got{color:var(--gold); text-shadow:0 0 8px var(--gold)}
.map-sky .scr-h{color:#fff; margin-bottom:4px; text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.map-sub{font-size:8.5px; color:rgba(255,255,255,.82); margin-bottom:12px; line-height:1.6;
  text-shadow:0 1px 0 rgba(0,0,0,.4)}
.node-row{display:flex; align-items:center; justify-content:center; gap:2px; flex-wrap:wrap}
.node{
  width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.34); border:2px solid rgba(255,255,255,.4);
  color:#fff; font-size:8px; text-align:center;
}
.node.done{background:var(--hi); border-color:#fff}
.node.cur{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold); animation:pulse 1s infinite}
.node.gymnode{background:rgba(232,104,58,.5)}
.node.champnode{background:rgba(255,210,62,.4); color:var(--gold); font-size:16px}
.node-link{width:12px; height:3px; background:rgba(255,255,255,.35)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--gold)}50%{box-shadow:0 0 0 4px rgba(255,210,62,.4)}}

.map-lower{margin-top:auto}

/* ============ ADVENTURE MAP ============ */
.map-top{
  border:3px solid var(--line); box-shadow:var(--shadow);
  padding:12px 12px 16px; margin-bottom:12px; display:flex; flex-direction:column;
}
.map-topbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
.shard-hud{font-size:9px; color:var(--gold); background:rgba(0,0,0,.4);
  border:2px solid var(--line); padding:5px 8px; text-shadow:0 0 6px rgba(255,210,62,.5)}
.shard-hud.big{align-self:center; font-size:11px; padding:7px 12px; margin-bottom:10px}
.map-h{color:#fff; margin-bottom:2px; text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.map-hint{text-align:center; font-size:8px; color:rgba(255,255,255,.8); margin-bottom:8px; letter-spacing:1px}
.map-canvas{position:relative; width:100%; height:400px}
.map-svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.edge{stroke:rgba(255,255,255,.22); stroke-width:.7; stroke-dasharray:2 2}
.edge-on{stroke:var(--gold); stroke-width:1.1; stroke-dasharray:none}
.mapnode{
  position:absolute; transform:translate(-50%,-50%);
  width:42px; height:42px; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--nc,#57a84e); border:3px solid var(--line); color:#fff;
  font-size:14px; cursor:default; box-shadow:var(--shadow); padding:0;
}
.mapnode .mn-g{line-height:1; text-shadow:0 1px 0 rgba(0,0,0,.5)}
.mapnode .mn-l{position:absolute; top:44px; font-size:6.5px; color:var(--cream);
  white-space:nowrap; letter-spacing:1px; text-shadow:0 1px 2px #000}
.mapnode.lock{opacity:.55; filter:grayscale(.45)}
.mapnode.lock .mn-l{opacity:.75}
.mapnode.rivalnode{box-shadow:0 0 0 2px #e84a6f, var(--shadow)}
.hpfill.hp-lo{animation:hplow .9s infinite}
@keyframes hplow{0%,100%{opacity:1}50%{opacity:.55}}
.mapnode.done{opacity:.55}
.mapnode.done .mn-g{color:#fff}
.mapnode.cur{box-shadow:0 0 0 3px var(--gold), var(--shadow)}
.mapnode.reach{cursor:pointer; animation:mnpulse 1.2s infinite}
.mapnode.reach:hover{transform:translate(-50%,-50%) scale(1.12)}
@keyframes mnpulse{0%,100%{box-shadow:0 0 0 2px rgba(255,210,62,.5),var(--shadow)}50%{box-shadow:0 0 0 5px rgba(255,210,62,.25),var(--shadow)}}

/* ============ REGION INTRO ============ */
.region-intro{
  border:3px solid var(--line); box-shadow:var(--shadow);
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:26px 20px; text-align:center;
}
.region-eyebrow{font-size:9px; letter-spacing:3px; color:rgba(255,255,255,.8)}
.region-title{font-size:22px; color:#fff; text-shadow:3px 3px 0 rgba(0,0,0,.5); line-height:1.3}
.region-lore{font-size:9px; color:var(--cream); line-height:1.9; max-width:300px}
.region-leader{font-size:8.5px; color:rgba(255,255,255,.9); background:rgba(0,0,0,.3);
  border:2px solid var(--line); padding:7px 11px}
.region-leader b{color:var(--gold)}

/* ============ REST / SITE / SHOP ============ */
.site-wrap{display:flex; flex-direction:column; gap:12px; padding-top:6px}
.site-desc{font-size:8.5px; color:var(--cream2); text-align:center; line-height:1.8; margin-bottom:4px}
.site-opts{display:flex; flex-direction:column; gap:10px}
.site-card{text-align:left; padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:4px}
.site-card:hover{border-color:var(--gold)}
.site-name{font-size:11px; color:var(--ink); letter-spacing:1px}
.shop-list{display:flex; flex-direction:column; gap:8px; margin-bottom:6px}
.shop-row{display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--cream); border:3px solid var(--line); box-shadow:var(--shadow); padding:9px 11px}
.shop-row.sold{opacity:.5}
.shop-info{font-size:8.5px; color:var(--ink); line-height:1.5; flex:1}
.shop-buy{font-size:9px; padding:9px 11px; white-space:nowrap; background:var(--gold)}
.shop-buy:disabled{background:#cbbf9e; color:#7a7258}

/* ============ EVENT ============ */
.event-wrap{padding:18px 16px; display:flex; flex-direction:column; gap:12px; margin:auto 0}
.event-eyebrow{font-size:8px; letter-spacing:3px; color:var(--shade); text-align:center}
.event-title{font-size:15px; color:var(--ink); text-align:center; letter-spacing:1px}
.event-text{font-size:9px; color:#4a4266; line-height:1.9; text-align:center}
.event-opts{display:flex; flex-direction:column; gap:9px; margin-top:4px}
.event-opt{text-align:left; font-size:9px; padding:12px 14px; background:var(--cream2)}
.event-opt:hover{background:var(--gold)}

/* ============ DAMAGE POPUPS + SHAKE ============ */
.dmg-layer{position:absolute; inset:0; pointer-events:none; z-index:5}
.dmg-pop{position:absolute; transform:translate(-50%,-50%); font-size:16px; color:#fff;
  text-shadow:2px 2px 0 #000,-1px -1px 0 #000; animation:dmgfloat .9s ease-out forwards}
.dmg-crit{font-size:20px; color:var(--gold)}
.dmg-super{color:#ffb14e}
.dmg-weak{color:#9fd8ff; font-size:13px}
@keyframes dmgfloat{0%{opacity:0; transform:translate(-50%,-30%) scale(.6)}
  20%{opacity:1; transform:translate(-50%,-60%) scale(1.1)}
  100%{opacity:0; transform:translate(-50%,-160%) scale(1)}}
.battle-stage.shake{animation:stageshake .28s}
@keyframes stageshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.reward-note{text-align:center; font-size:9px; color:var(--gold); margin-bottom:10px; letter-spacing:1px}

/* screen fade: superseded by the v3 scrin transition below */
.team-strip{
  display:grid; grid-template-columns:repeat(6,1fr); gap:5px; margin-bottom:14px;
}
.team-slot{
  background:var(--ink); border:2px solid var(--line);
  padding:4px 2px 5px; display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:pointer; min-height:74px; justify-content:center;
}
.team-slot canvas{width:40px; height:40px}
.team-slot.lead{border-color:var(--gold)}
.team-slot.fainted{opacity:.55}
.team-slot.empty{color:#4a4668; cursor:default; font-size:14px; align-items:center}
.ts-name{font-size:6.5px; color:var(--cream); text-align:center; line-height:1.2}
.ts-lvl{font-size:6px; color:var(--cream2)}
.map-actions{display:flex; flex-direction:column; align-items:center; gap:9px}
.map-btnrow{display:flex; gap:8px; width:100%; max-width:320px}
.map-btnrow .btn{flex:1; font-size:8.5px; padding:9px 4px}

.hud-corner{position:absolute; top:12px; right:12px; z-index:40; display:flex; gap:6px}

/* ---------- battle ---------- */
#scr-battle{padding:0}
.battle-stage{
  position:relative; flex:0 0 auto; height:300px;
  border-bottom:4px solid var(--line);
  overflow:hidden; padding:12px;
}
.foe-row{position:relative; display:flex; justify-content:space-between; align-items:flex-start}
.foe-row canvas{margin-top:-4px; margin-right:6px}
.ally-row{display:flex; justify-content:space-between; align-items:flex-end;
  position:absolute; left:12px; right:12px; bottom:6px}
.ally-row canvas{margin-left:2px; margin-bottom:-6px}
.info-box{
  padding:7px 9px; min-width:150px; max-width:190px;
}
.info-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.mon-name{font-size:10px; color:var(--ink)}
.mon-lvl{font-size:8px; color:#4a4360}
.info-row{display:flex; gap:4px; margin:4px 0}
.chip{color:#fff; font-size:7px; padding:2px 5px; text-shadow:0 1px 0 rgba(0,0,0,.4); letter-spacing:.5px}
.chip-status{background:var(--shade)!important}
.hpbar{height:9px; background:#3a2f26; border:1px solid var(--line); overflow:hidden; margin-top:2px}
.hp-sm{height:5px; width:90%}
.hpfill{height:100%; transition:width .35s ease}
.hp-hi{background:var(--hi)} .hp-mid{background:var(--mid)} .hp-lo{background:var(--lo)}
.hp-num{font-size:8px; color:#4a4360; text-align:right; margin-top:3px}
.xpbar{height:4px; background:#3a2f26; border:1px solid var(--line); margin-top:3px; overflow:hidden}
.xpfill{height:100%; background:#5aa8e8; transition:width .3s}

.msg{
  margin:10px 12px; padding:12px 14px; min-height:56px;
  font-size:10px; line-height:1.7; color:var(--ink);
  display:flex; align-items:center;
}
.msg.pop{animation:msgpop .2s}
@keyframes msgpop{from{transform:scale(.98); opacity:.6}to{transform:scale(1); opacity:1}}

.cmd{padding:0 12px 14px; min-height:120px}
.cmd-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.cmd-btn{width:100%; text-align:left; font-size:9px; line-height:1.5}
.cmd-fight{background:var(--ember); color:#fff}
.cmd-orb{background:#5aa8e8; color:#fff}
.cmd-run{background:var(--cream2)}
.move-btn{min-height:52px}
.opt-sub{font-size:7px; color:#6a6280; letter-spacing:0}
.cmd-btn.move-btn .opt-sub{color:#5a5270}
.eff-up{color:var(--hi); font-size:9px}
.eff-dn{color:var(--lo); font-size:9px}
.cmd .btn-ghost{margin-top:8px; width:100%; font-size:9px; color:var(--cream)}

/* ---------- modal ---------- */
#modal{
  position:absolute; inset:0; z-index:50;
  display:none; align-items:center; justify-content:center;
  background:rgba(8,6,18,.72); padding:20px 16px;
}
#modal.open{display:flex}
.modal-box{
  padding:16px; width:100%; max-width:360px;
  max-height:88%; overflow-y:auto;
  display:flex; flex-direction:column; gap:10px;
  animation:modalin .18s;
}
@keyframes modalin{from{transform:translateY(10px); opacity:0}to{transform:translateY(0); opacity:1}}
.modal-wide{max-width:400px}
.modal-title{font-size:12px; color:var(--ink); text-align:center; line-height:1.5}
.modal-sub{font-size:8.5px; color:#4a4360; text-align:center; line-height:1.7}
.modal-list{display:flex; flex-direction:column; gap:7px}
.modal-opt{text-align:left; font-size:9px; line-height:1.5}
.modal-box .btn{width:100%}
.modal-box canvas{margin:0 auto; display:block}

/* mon sheet */
.sheet-head{display:flex; gap:12px; align-items:center}
.sheet-head canvas{flex:0 0 auto}
.sheet-head>div{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px}
.sheet-stats{font-size:9px; color:#4a4360; text-align:center; padding:6px;
  background:#e6d9ba; border:2px solid var(--line)}
.sheet-moves{display:flex; flex-direction:column; gap:5px}
.move-line{font-size:8.5px; color:var(--ink); display:flex; align-items:center; gap:6px;
  padding:5px 7px; background:#e6d9ba; border:2px solid var(--line)}
.mv-pow{margin-left:auto; font-size:7px; color:#6a6280}
.sheet-btns{display:flex; flex-direction:column; gap:7px}

.charm-row{font-size:8.5px; color:var(--ink); line-height:1.7;
  padding:8px; background:#e6d9ba; border:2px solid var(--line)}

/* evolution */
.evo-box{text-align:center; align-items:center}
.evo-box canvas{animation:evoglow 1.2s infinite alternate}
@keyframes evoglow{from{filter:brightness(1)}to{filter:brightness(1.4) drop-shadow(0 0 12px var(--gold))}}

/* ---------- reward ---------- */
.reward-row{display:flex; flex-direction:column; gap:12px; margin:auto 0}
.reward-card{padding:14px; text-align:center; display:flex; flex-direction:column; gap:8px}
.reward-kind{font-size:8px; color:#6a6280; letter-spacing:2px}
.reward-name{font-size:12px; color:var(--ink)}
.reward-card .dex{color:#4a4360}
.reward-charm{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), var(--shadow)}
.reward-charm .reward-kind{color:var(--ember)}
.reward-charm .reward-name{color:var(--ember)}

/* ---------- endings ---------- */
.end-wrap{margin:auto; display:flex; flex-direction:column; align-items:center; gap:16px;
  text-align:center; padding:20px 0}
.end-stats{padding:16px 20px; display:flex; flex-direction:column; gap:8px;
  font-size:9.5px; color:var(--ink); text-align:left; min-width:220px}
.end-stats b{color:var(--ember)}
.hof{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:360px}
.hof-slot{background:var(--ink); border:2px solid var(--gold); padding:5px 4px 6px;
  display:flex; flex-direction:column; align-items:center; gap:2px; width:76px}

/* help */
.help-text{font-size:8.5px; color:var(--ink); line-height:1.8; display:flex; flex-direction:column; gap:8px}
.help-text b{color:var(--ember)}

/* prime */
.chip-prime{background:var(--gold)!important; color:var(--ink)!important; text-shadow:none!important}

/* title extras */
.title-btnrow{display:flex; gap:8px; width:100%; max-width:320px}
.title-btnrow .btn{flex:1; font-size:9px; padding:10px 4px}

/* difficulty */
.diff-row{display:flex; flex-direction:column; gap:12px; margin:auto 0}
.diff-card{padding:14px; display:flex; flex-direction:column; gap:7px; text-align:center; position:relative}
.diff-card .btn{width:100%; margin-top:2px}
.diff-name{font-size:14px; color:var(--ink); letter-spacing:1px}
.diff-rec{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), var(--shadow)}
.diff-tag{font-size:7px; color:var(--ember); letter-spacing:2px}

/* difficulty badge on map */
.diff-badge{font-size:7px; color:var(--gold); background:rgba(0,0,0,.4);
  border:2px solid var(--line); padding:6px 7px; letter-spacing:1px; align-self:center}

/* beast dex */
.dex-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px}
.dex-cell{padding:8px 4px 9px; display:flex; flex-direction:column; align-items:center; gap:3px;
  min-height:96px; justify-content:center; cursor:pointer}
.dex-cell canvas{width:52px; height:52px}
.dex-locked{opacity:.7; cursor:default; background:#d8cbac}
.dex-caught{border-color:var(--hi)}
.dex-name{font-size:7px; color:var(--ink); text-align:center; line-height:1.3}
.dex-mark{font-size:6.5px; color:#5a5270}
.dex-prime{color:var(--ember)}
.hof-prime{border-color:var(--gold)!important; box-shadow:0 0 8px rgba(255,210,62,.5)}

/* ---------- v3 polish ---------- */
.screen.active{animation:scrin .22s ease-out}
@keyframes scrin{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

/* achievement toast */
#toast{position:absolute; top:10px; left:50%; transform:translate(-50%,-140%);
  z-index:70; background:var(--ink); color:var(--gold); border:3px solid var(--gold);
  box-shadow:var(--shadow); padding:9px 14px; font-size:8.5px; line-height:1.6;
  text-align:center; transition:transform .3s ease; pointer-events:none; max-width:86%}
#toast.show{transform:translate(-50%,0)}
#toast .tst-t{color:var(--cream); font-size:7px; letter-spacing:2px}

/* ambient particle layer */
.fx-layer{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}

/* stat stage arrows */
.stage-row{display:flex; gap:6px; margin-top:3px; font-size:7px}
.stg{color:#4a4360}
.stg b{font-size:7px}
.stg-up{color:#2e8540} .stg-dn{color:#c04a28}

/* trinkets */
.trink-chip{background:#8a6ad0!important}
.trink-row{font-size:8.5px; color:var(--ink); line-height:1.7;
  padding:8px; background:#e6d9ba; border:2px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:8px}
.trink-row .btn{width:auto!important; flex:0 0 auto}
.reward-trinket{border-color:#8a6ad0; box-shadow:0 0 0 2px #8a6ad0, var(--shadow)}
.reward-trinket .reward-kind{color:#6a48b8}
.reward-trinket .reward-name{color:#6a48b8}

/* type chart */
.tc-grid{display:grid; gap:2px; font-size:7px; text-align:center}
.tc-cell{padding:5px 0; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.4)}
.tc-head{font-size:6.5px; letter-spacing:0}
.tc-num{background:#d8cbac; color:#4a4360; border:1px solid #c4b694}
.tc-2{background:var(--hi); color:#fff; font-weight:bold}
.tc-h{background:var(--ember); color:#fff}
.tc-note{font-size:7px; color:#6a6280; text-align:center; line-height:1.7}

/* medals */
.medal-row{font-size:8.5px; color:var(--ink); line-height:1.6; padding:8px;
  background:#e6d9ba; border:2px solid var(--line); display:flex; gap:9px; align-items:center}
.medal-ico{font-size:14px; width:22px; text-align:center; flex:0 0 auto}
.medal-row.locked{opacity:.55; filter:grayscale(.7)}
.medal-row.locked .medal-ico{filter:grayscale(1)}
.medal-got{color:var(--ember)}

/* title sprites bob */
.title-beasts canvas{animation:tbob 2.6s ease-in-out infinite}
.title-beasts canvas:nth-child(2){animation-delay:.4s}
.title-beasts canvas:nth-child(3){animation-delay:.8s}
@keyframes tbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* victory glow */
.win-glow{animation:winglow 1.4s ease-in-out infinite alternate}
@keyframes winglow{from{text-shadow:3px 3px 0 var(--ember), 6px 6px 0 rgba(0,0,0,.4)}
  to{text-shadow:3px 3px 0 var(--ember), 6px 6px 0 rgba(0,0,0,.4), 0 0 18px rgba(255,210,62,.9)}}

@media (max-height:680px){
  .battle-stage{height:250px}
  .logo{font-size:28px}
  .title-beasts canvas{transform:scale(.85)}
}

/* ============================================================
   BEASTBOUND - engine (pure-ish logic)
   ============================================================ */

const rnd = (a,b)=>a+Math.random()*(b-a);
const irnd = (a,b)=>Math.floor(rnd(a,b+1));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

function statsFor(id,lvl,prime){
  const b = SPECIES[id].bs;
  const k = prime ? PRIME_STAT : 1;
  return {
    maxHP: Math.floor(b.hp*(1+(lvl-1)*0.07)*k)+lvl+8,
    atk:   Math.floor(b.atk*(1+(lvl-1)*0.055)*k)+3,
    def:   Math.floor(b.def*(1+(lvl-1)*0.055)*k)+3,
    spd:   Math.floor(b.spd*(1+(lvl-1)*0.055)*k)+3
  };
}

function movesAtLevel(id,lvl){
  const learned = learnsetFor(id).filter(e=>e[0]<=lvl).map(e=>e[1]);
  const uniq = [...new Set(learned)];
  return uniq.slice(-4);
}

function makeMon(id,lvl,prime){
  const st = statsFor(id,lvl,prime);
  const mon = {
    id, lvl, xp:0,
    curHP:st.maxHP, maxHP:st.maxHP, atk:st.atk, def:st.def, spd:st.spd,
    moves:movesAtLevel(id,lvl),
    stages:{atk:0,def:0,spd:0},
    status:null
  };
  if(prime) mon.prime = true;
  return mon;
}

function xpToNext(lvl){ return Math.floor(lvl*lvl*1.2)+24; }
function xpYield(mon,isTrainer){
  return Math.max(4, Math.floor(SPECIES[mon.id].xp*mon.lvl/3*(isTrainer?1.25:1)));
}

function stageMult(s){ return s>=0 ? (2+s)/2 : 2/(2-s); }

function effMult(moveType,defType){
  if(moveType==="NONE") return 1;
  return CHART[moveType][defType];
}

/* returns {dmg, eff, crit} */
function calcDamage(att,dfn,moveKey,attIsPlayer,charms){
  const mv = MOVES[moveKey];
  if(!mv.p) return {dmg:0,eff:1,crit:false};
  const aSp = SPECIES[att.id], dSp = SPECIES[dfn.id];
  let A = att.atk*stageMult(att.stages.atk);
  let D = dfn.def*stageMult(dfn.stages.def);
  if(att.trinket==="powerband") A*=1.1;
  if(dfn.trinket==="ironshell") D*=1.1;
  if(att.status==="BRN") A*=0.75;
  let dmg = (((2*att.lvl/5+2)*mv.p*(A/D))/50)+2;
  const eff = effMult(mv.t,dSp.t);
  const stab = mv.t===aSp.t?1.5:1;
  let critCh = (attIsPlayer && charms && charms.keenCharm) ? 1/8 : 1/16;
  if(att.trinket==="scopelens") critCh += 0.06;
  const crit = Math.random()<critCh;
  let charmBoost = 1;
  if(attIsPlayer && charms){
    for(const ck in charms){
      if(CHARMS[ck] && CHARMS[ck].t===mv.t) charmBoost = 1.2;
    }
  }
  dmg *= eff*stab*(crit?1.5:1)*charmBoost*rnd(0.85,1);
  return {dmg:Math.max(1,Math.floor(dmg)), eff, crit};
}

function effSpd(m){
  let s = m.spd*stageMult(m.stages.spd);
  if(m.trinket==="swiftfeather") s*=1.1;
  if(m.status==="PAR") s*=0.5;
  return s;
}

/* catch roll: true if caught. shakes = 0-3 for animation feedback */
function catchRoll(mon,orbPow,charms){
  const sp = SPECIES[mon.id];
  const hpFrac = mon.curHP/mon.maxHP;
  let ch = sp.cr*orbPow*(1+(1-hpFrac)*2.2)*(mon.status?1.3:1);
  if(charms && charms.luckCharm) ch*=1.25;
  ch = clamp(ch,0.02,0.95);
  const caught = Math.random()<ch;
  const shakes = caught?3:Math.floor(clamp(ch,0,0.9)*3+Math.random());
  return {caught, shakes:clamp(shakes,0,3)};
}

/* grant xp; returns list of event objects for the UI to narrate */
function grantXP(mon,amount){
  const events=[];
  if(mon.curHP<=0) return events;
  mon.xp += amount;
  while(mon.xp >= xpToNext(mon.lvl) && mon.lvl<50){
    mon.xp -= xpToNext(mon.lvl);
    mon.lvl++;
    const before = {maxHP:mon.maxHP};
    const st = statsFor(mon.id,mon.lvl,mon.prime);
    const hpGain = st.maxHP-before.maxHP;
    mon.maxHP=st.maxHP; mon.atk=st.atk; mon.def=st.def; mon.spd=st.spd;
    mon.curHP = Math.min(mon.maxHP, mon.curHP+hpGain);
    events.push({type:"level", lvl:mon.lvl});
    for(const [lv,mk] of learnsetFor(mon.id)){
      if(lv===mon.lvl && !mon.moves.includes(mk)){
        if(mon.moves.length<4){ mon.moves.push(mk); events.push({type:"learned", move:mk}); }
        else events.push({type:"wantslearn", move:mk});
      }
    }
  }
  return events;
}

function checkEvolution(mon){
  const sp = SPECIES[mon.id];
  if(sp.ev && mon.lvl>=sp.ev[0]) return sp.ev[1];
  return null;
}

function evolveMon(mon,toId){
  const hpFrac = mon.curHP/mon.maxHP;
  mon.id = toId;
  const st = statsFor(toId,mon.lvl,mon.prime);
  mon.maxHP=st.maxHP; mon.atk=st.atk; mon.def=st.def; mon.spd=st.spd;
  mon.curHP = Math.max(1,Math.floor(st.maxHP*hpFrac));
  for(const [lv,mk] of learnsetFor(toId)){
    if(lv<=mon.lvl && !mon.moves.includes(mk) && mon.moves.length<4) mon.moves.push(mk);
  }
}

/* enemy AI: mostly picks best expected move */
function aiPickMove(att,dfn){
  const dmgMoves = att.moves.filter(k=>MOVES[k].p>0);
  const statMoves = att.moves.filter(k=>!MOVES[k].p);
  if(dmgMoves.length && Math.random()<0.85){
    let best=dmgMoves[0], bestScore=-1;
    for(const k of dmgMoves){
      const mv=MOVES[k];
      const s = mv.p*effMult(mv.t,SPECIES[dfn.id].t)*(mv.t===SPECIES[att.id].t?1.5:1)*(mv.acc/100);
      if(s>bestScore){bestScore=s;best=k;}
    }
    return best;
  }
  if(statMoves.length && Math.random()<0.5) return pick(statMoves);
  return dmgMoves.length?pick(dmgMoves):pick(att.moves);
}

/* rewards */
function rollRewards(state,count,charmBoost){
  const out=[];
  const ownedCharms = state.charms;
  let tries=0;
  while(out.length<count && tries<80){
    tries++;
    let table = REWARDS.slice();
    if(charmBoost) table = table.map(r=>r[1]==="charm"?[r[0]*3,r[1],r[2],r[3]]:r);
    const total = table.reduce((s,r)=>s+r[0],0);
    let roll = Math.random()*total, chosen=null;
    for(const r of table){ roll-=r[0]; if(roll<=0){chosen=r;break;} }
    if(!chosen) chosen=table[0];
    if(chosen[1]==="charm"){
      const avail = Object.keys(CHARMS).filter(c=>!ownedCharms[c]&&!out.some(o=>o.kind==="charm"&&o.key===c));
      if(!avail.length) continue;
      out.push({kind:"charm", key:pick(avail)});
    } else if(chosen[1]==="trinket"){
      const avail = Object.keys(TRINKETS).filter(k=>!out.some(o=>o.kind==="trinket"&&o.key===k));
      if(!avail.length) continue;
      out.push({kind:"trinket", key:pick(avail)});
    } else {
      const key=chosen[2], qty=chosen[3];
      if(out.some(o=>o.kind==="item"&&o.key===key)) continue;
      out.push({kind:"item", key, qty});
    }
  }
  return out;
}

/* status end-of-turn chip damage; returns text or null */
function statusTick(mon){
  if(!mon||mon.curHP<=0) return null;
  if(mon.status==="BRN"){ const d=Math.max(1,Math.floor(mon.maxHP/16)); mon.curHP=Math.max(0,mon.curHP-d); return {txt:"is hurt by its burn!", d}; }
  if(mon.status==="PSN"){ const d=Math.max(1,Math.floor(mon.maxHP/10)); mon.curHP=Math.max(0,mon.curHP-d); return {txt:"is hurt by poison!", d}; }
  return null;
}

function statusName(s){ return {BRN:"burned",PAR:"paralyzed",PSN:"poisoned"}[s]||""; }

/* build a wild encounter for zone */
function buildWild(zoneIdx,lvOff){
  lvOff = lvOff||0;
  const z = ZONES[zoneIdx];
  const raw = pick(z.pool);
  const id = WILD_ALIAS[raw] || raw;
  const lvl = Math.max(2, irnd(z.lv[0],z.lv[1]) + lvOff);
  const prime = Math.random() < PRIME_CHANCE;
  return makeMon(id,lvl,prime);
}

function buildTrainerTeam(def,lvOff){
  lvOff = lvOff||0;
  return def.team.map(([id,lvl])=>makeMon(WILD_ALIAS[id]||id, Math.max(2, lvl+lvOff)));
}

/* ---------- tiny synth ---------- */
let AC=null;
function beep(freq,dur,type="square",vol=0.04){
  if(S.muted) return;
  try{
    AC = AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ---------- sprite rendering ---------- */
function drawSprite(ctx,id,x,y,scale,mirror,opts={}){
  const sp=SPECIES[id], grid=GRIDS[sp.grid];
  const pal = opts.prime ? primePalette(sp.pal) : sp.pal;
  ctx.save();
  if(mirror){ ctx.translate(x+16*scale,y); ctx.scale(-1,1); }
  else ctx.translate(x,y);
  for(let r=0;r<16;r++){
    const row=grid[r];
    for(let c=0;c<16;c++){
      const ch=row[c];
      if(ch===".") continue;
      ctx.fillStyle = opts.white ? "#ffffff"
                    : opts.silhouette ? "#2b2740"
                    : (pal[ch]||"#f0f");
      ctx.fillRect(c*scale, r*scale, scale, scale);
    }
  }
  ctx.restore();
}

function drawMini(canvas,id,fainted,opts={}){
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const scale=canvas.width/16;
  drawSprite(ctx,id,0,0,scale,false,opts);
  if(fainted){ ctx.fillStyle="rgba(20,16,40,.65)"; ctx.fillRect(0,0,canvas.width,canvas.height); }
}

const REGION_FX = [

const FX={ps:[], last:0};
function fxConfig(){ return REGION_FX[S.phase==="zones"?S.zoneIdx:8] || REGION_FX[8]; }
function fxSpawn(w,h,cfg){
  const p={c:pick(cfg.cols), type:cfg.type, phase:Math.random()*6.28, age:0};
  if(cfg.type==="leaf"||cfg.type==="snow"){
    p.x=Math.random()*w; p.y=-6;
    p.vx=rnd(-6,6); p.vy=cfg.type==="snow"?rnd(10,22):rnd(16,30);
    p.s=cfg.type==="snow"?rnd(1.5,2.5):rnd(2,3.5); p.ttl=rnd(9,14);
  } else if(cfg.type==="bubble"||cfg.type==="ember"){
    p.x=Math.random()*w; p.y=h+6;
    p.vx=rnd(-5,5); p.vy=cfg.type==="ember"?rnd(-34,-18):rnd(-22,-12);
    p.s=rnd(1.5,3); p.ttl=rnd(6,11);
  } else if(cfg.type==="spark"){
    p.x=Math.random()*w; p.y=Math.random()*h*0.8;
    p.vx=0; p.vy=rnd(-8,-3); p.s=rnd(1.5,2.5); p.ttl=rnd(0.8,1.8);
  } else if(cfg.type==="wind"){
    p.x=-14; p.y=Math.random()*h*0.85;
    p.vx=rnd(90,150); p.vy=rnd(-4,4); p.s=rnd(8,16); p.ttl=rnd(4,7);
  } else if(cfg.type==="dust"){
    p.x=Math.random()*w; p.y=Math.random()*h;
    p.vx=rnd(4,12); p.vy=rnd(-3,3); p.s=rnd(1.5,2.5); p.ttl=rnd(6,10);
  } else { /* mote */
    p.x=Math.random()*w; p.y=Math.random()*h;
    p.vx=rnd(-6,6); p.vy=rnd(-8,-2); p.s=rnd(1.5,3); p.ttl=rnd(4,8);
  }
  return p;
}
function drawFX(cv,ts){
  const cfg=fxConfig();
  const dt=Math.min(0.05,(ts-(FX.last||ts))/1000); FX.last=ts;
  const w=cv.width,h=cv.height;
  if(!w||!h) return;
  if(FX.ps.length<cfg.n && Math.random()<0.25) FX.ps.push(fxSpawn(w,h,cfg));
  const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,w,h);
  FX.ps=FX.ps.filter(p=>{
    p.age+=dt;
    if(p.age>p.ttl || p.y>h+10 || p.y<-12 || p.x>w+20 || p.x<-20) return false;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    let a=1, s=p.s;
    if(p.type==="leaf"||p.type==="snow") p.x+=Math.sin(p.phase+p.age*2)*0.35;
    if(p.type==="ember"){ a=1-p.age/p.ttl; s=p.s*(1-p.age/p.ttl*0.6); }
    if(p.type==="spark") a=Math.abs(Math.sin(p.age*10))*0.9;
    if(p.type==="mote") a=0.35+Math.abs(Math.sin(p.phase+p.age*1.5))*0.55;
    if(p.type==="bubble") a=0.6;
    if(p.type==="dust") a=0.5;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.c;
    if(p.type==="wind") ctx.fillRect(p.x,p.y,s,1.5);
    else ctx.fillRect(p.x,p.y,s,s);
    return true;
  });
  ctx.globalAlpha=1;
}
function resetAnim(side){ Object.assign(ANIM[side],{flash:0,lunge:0,shake:0,hidden:false,enter:performance.now()}); }

function battleLoop(ts){
  if(!ANIM.running) return;
  const fxcv=$("#cv-fx");
  if(fxcv){
    if(fxcv.width!==fxcv.clientWidth||fxcv.height!==fxcv.clientHeight){
      fxcv.width=fxcv.clientWidth||1; fxcv.height=fxcv.clientHeight||1;
    }
    drawFX(fxcv,ts);
  }
  for(const side of ["p","e"]){
    const st=ANIM[side], b=S.battle;
    if(!b){continue;}
    const mon = side==="p"?b.pmon:b.emon;
    const cv = $(side==="p"?"#cv-player":"#cv-enemy");
    if(!cv||!mon) continue;
    const ctx=cv.getContext("2d");
    ctx.imageSmoothingEnabled=false;
    ctx.clearRect(0,0,cv.width,cv.height);
    /* platform */
    ctx.fillStyle="rgba(0,0,0,.28)";
    ctx.beginPath(); ctx.ellipse(cv.width/2,cv.height-14,cv.width*0.36,10,0,0,Math.PI*2); ctx.fill();
    if(st.hidden) continue;
    const scale=Math.floor(cv.width/18);
    const bobY=Math.sin(ts/420+ (side==="p"?0:1.4))*2.5;
    let ox=(cv.width-16*scale)/2, oy=cv.height-16*scale-12+bobY;
    if(st.enter && ts-st.enter<360){
      const t=(ts-st.enter)/360, e=1-Math.pow(1-t,3);
      ox += (side==="p"?-1:1)*(1-e)*cv.width*0.6;
    }
    if(st.lunge>ts-160){ ox += (side==="p"?1:-1)*10; }
    if(st.shake>ts-260){ ox += Math.sin(ts/18)*4; }
    const white = st.flash>ts-120 && Math.floor(ts/60)%2===0;
    drawSprite(ctx,mon.id,ox,oy,scale, side==="p", {white, prime:mon.prime});
    if(mon.prime && !st.hidden){
      const spk=[[3,2],[13,4],[2,11],[12,12]];
      ctx.fillStyle="#ffd23e";
      spk.forEach((s,i)=>{ if(Math.floor(ts/220+i)%3===0){
        ctx.fillRect(ox+s[0]*scale, oy+s[1]*scale, Math.max(2,scale*0.6), Math.max(2,scale*0.6)); }});
    }
  }
  requestAnimationFrame(battleLoop);
}
function startBattleLoop(){ if(!ANIM.running){ ANIM.running=true; requestAnimationFrame(battleLoop);} }

/* ---------- HP / info panels ---------- */
function hpClass(frac){ return frac>0.5?"hp-hi":frac>0.2?"hp-mid":"hp-lo"; }
function typeChip(t){ return `<span class="chip" style="background:${TYPE_COLORS[t]}">${t}</span>`; }

function renderInfo(side){
  const b=S.battle; if(!b) return;
  const mon = side==="p"?b.pmon:b.emon;
  const box = $(side==="p"?"#info-player":"#info-enemy");
  if(!mon){ box.innerHTML=""; return; }
  const sp=SPECIES[mon.id];
  const frac=mon.curHP/mon.maxHP;
  let html = `<div class="info-top"><span class="mon-name">${esc(sp.n)}</span>`+
    `<span class="mon-lvl">Lv${mon.lvl}</span></div>`+
    `<div class="info-row">${typeChip(sp.t)}${mon.prime?'<span class="chip chip-prime">&#10022; PRIME</span>':""}${mon.status?`<span class="chip chip-status">${mon.status}</span>`:""}</div>`+
    `<div class="hpbar"><div class="hpfill ${hpClass(frac)}" style="width:${Math.max(0,frac*100)}%"></div></div>`;
  const stg=["atk","def","spd"].filter(k=>mon.stages && mon.stages[k]);
  if(stg.length){
    html+=`<div class="stage-row">`+stg.map(k=>{
      const v=mon.stages[k];
      const arrow=(v>0?"&#9650;":"&#9660;").repeat(Math.min(3,Math.abs(v)));
      return `<span class="stg ${v>0?"stg-up":"stg-dn"}"><b>${k.toUpperCase()}</b>${arrow}</span>`;
    }).join("")+`</div>`;
  }
  if(side==="p"){
    html += `<div class="hp-num">${Math.max(0,mon.curHP)} / ${mon.maxHP}</div>`;
    const xf = mon.xp/xpToNext(mon.lvl);
    html += `<div class="xpbar"><div class="xpfill" style="width:${Math.min(100,xf*100)}%"></div></div>`;
  }
  box.innerHTML=html;
}

function satchelKeys(){ return Object.keys(S.trinkets||{}).filter(k=>S.trinkets[k]>0); }
function addToSatchel(key,n){ S.trinkets=S.trinkets||{}; S.trinkets[key]=(S.trinkets[key]||0)+(n||1); }
function takeFromSatchel(key){ if(S.trinkets&&S.trinkets[key]>0) S.trinkets[key]--; }

/* a trinket was gained: choose a holder now or stash it */
function gainTrinket(key){
  return new Promise(async res=>{
    const t=TRINKETS[key];
    const opts=S.team.map(m=>{
      const cur=m.trinket?` (holds ${TRINKETS[m.trinket].n})`:"";
      return {html:`Give to <b>${esc(SPECIES[m.id].n)}</b> Lv${m.lvl}${esc(cur)}`};
    });
    opts.push({html:"<b>Keep in satchel</b>",cls:"btn-ghost"});
    const c=await modalChoice(`${t.n} acquired!`,opts,{sub:t.d,cancel:false});
    if(c>=0 && c<S.team.length){
      const m=S.team[c];
      if(m.trinket) addToSatchel(m.trinket);
      m.trinket=key;
    } else addToSatchel(key);
    saveRun();
    res();
  });
}

/* manage a beast's held trinket from its sheet */
function openTrinketMenu(mon,after){
  return new Promise(async res=>{
    const opts=[];
    const actions=[];
    if(mon.trinket){
      opts.push({html:`Remove <b>${esc(TRINKETS[mon.trinket].n)}</b> to satchel`});
      actions.push(()=>{ addToSatchel(mon.trinket); mon.trinket=null; });
    }
    satchelKeys().forEach(k=>{
      opts.push({html:`Equip <b>${esc(TRINKETS[k].n)}</b> &times;${S.trinkets[k]}<br><span class="opt-sub">${esc(TRINKETS[k].d)}</span>`});
      actions.push(()=>{ if(mon.trinket) addToSatchel(mon.trinket); takeFromSatchel(k); mon.trinket=k; });
    });
    if(!opts.length){
      await modalChoice("TRINKETS",[],{sub:"No trinkets in your satchel. They appear as rewards, in shops, and from events.",cancel:true});
      return res(false);
    }
    const c=await modalChoice(`${SPECIES[mon.id].n}'s trinket`,opts,
      {sub:mon.trinket?`Currently holding: ${TRINKETS[mon.trinket].n}`:"Not holding a trinket."});
    if(c>=0){ actions[c](); saveRun(); if(after) after(); return res(true); }
    res(false);
  });
}

/* ---------- bag ---------- */
function bagEntries(battleMode){
  return Object.keys(S.bag).filter(k=>S.bag[k]>0).filter(k=>{
    const it=ITEMS[k];
    if(battleMode) return true;
    return it.kind==="heal"||it.kind==="revive"||it.kind==="candy"||it.kind==="elixir";
  });
}

/* returns true if an item was used (consumes battle turn) */
function openBag(battleMode){
  return new Promise(async res=>{
    const keys=bagEntries(battleMode);
    if(!keys.length){
      await modalChoice("BAG",[],{sub:"Your bag is empty"+(battleMode?"":" (only usable items shown outside battle)")+".",cancel:true});
      return res(false);
    }
    const c=await modalChoice("BAG",keys.map(k=>({
      html:`<b>${esc(ITEMS[k].n)}</b> &times;${S.bag[k]}<br><span class="opt-sub">${esc(ITEMS[k].d)}</span>`
    })));
    if(c<0) return res(false);
    const key=keys[c], it=ITEMS[key];
    const used=await useItem(key,it,battleMode);
    res(used);
  });
}

async function useItem(key,it,battleMode){
  if(it.kind==="orb"){
    if(!battleMode || !S.battle || S.battle.isTrainer){
      await modalChoice(it.n,[],{sub:"Orbs only work on wild beasts in battle.",cancel:true});
      return false;
    }
    S.bag[key]--; 
    await throwOrb(it.pow);
    return true;
  }
  if(it.kind==="battlebuff"){
    if(!battleMode||!S.battle){
      await modalChoice(it.n,[],{sub:"Only usable in battle.",cancel:true});
      return false;
    }
    S.bag[key]--;
    const mon=S.battle.pmon;
    mon.stages[it.stat]=clamp(mon.stages[it.stat]+2,-6,6);
    sfx.buff();
    await say(`${SPECIES[mon.id].n}'s ${it.stat.toUpperCase()} rose sharply!`);
    return true;
  }
  /* heal / revive / candy : pick a target */
  const opts=S.team.map(m=>{
    const sp=SPECIES[m.id];
    let disabled=false;
    if(it.kind==="heal") disabled = m.curHP<=0 || m.curHP>=m.maxHP;
    if(it.kind==="elixir") disabled = m.curHP<=0 || (m.curHP>=m.maxHP && !m.status);
    if(it.kind==="revive") disabled = m.curHP>0;
    return {html:`<b>${esc(sp.n)}</b> Lv${m.lvl} &middot; ${Math.max(0,m.curHP)}/${m.maxHP} HP`, disabled};
  });
  const t=await modalChoice("Use "+it.n+" on...",opts);
  if(t<0) return false;
  const mon=S.team[t], sp=SPECIES[mon.id];
  S.bag[key]--;
  if(it.kind==="heal"){
    const amt=S.charms.menderCharm?Math.floor(it.amt*1.5):it.amt;
    mon.curHP=Math.min(mon.maxHP,mon.curHP+amt);
    sfx.heal();
    if(battleMode) await say(`${sp.n} recovered HP!`);
  } else if(it.kind==="elixir"){
    mon.curHP=mon.maxHP; mon.status=null;
    sfx.heal();
    if(battleMode) await say(`${sp.n} was fully restored!`);
  } else if(it.kind==="revive"){
    mon.curHP=Math.floor(mon.maxHP/2); mon.status=null;
    sfx.heal();
    if(battleMode) await say(`${sp.n} was revived!`);
  } else if(it.kind==="candy"){
    const evs=grantXP(mon,xpToNext(mon.lvl)-mon.xp);
    sfx.level();
    for(const ev of evs) await narrateXPEvent(mon,ev,!battleMode);
    await maybeEvolve(mon);
  }
  if(S.screen==="map") renderMap();
  if(S.battle) renderInfos();
  return battleMode;
}

function cmdClear(){ $("#cmd").innerHTML=""; }

/* floating damage numbers + stage shake */
function popDamage(side,amount,crit,eff){
  const layer=$("#dmg-layer"); if(!layer) return;
  const d=el("div","dmg-pop"+(crit?" dmg-crit":"")+(eff>1?" dmg-super":eff<1?" dmg-weak":""));
  d.textContent=(crit?"!":"")+amount;
  d.style.left=(side==="e"?68:30)+"%";
  d.style.top=(side==="e"?26:56)+"%";
  layer.appendChild(d);
  setTimeout(()=>{ if(d.parentNode) d.parentNode.removeChild(d); }, 900);
}
function stageShake(){
  const st=$("#battle-stage"); if(!st) return;
  st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
}

function cmdMain(){
  const b=S.battle;
  const c=$("#cmd");
  c.innerHTML="";
  const grid=el("div","cmd-grid");
  const mk=(label,fn,cls)=>{const btn=el("button","btn cmd-btn "+(cls||""),label); btn.onclick=()=>{sfx.click();fn();}; grid.appendChild(btn); return btn;};
  mk("FIGHT",()=>cmdMoves(),"cmd-fight");
  const orbBtn=mk("THROW ORB",()=>cmdOrb(),"cmd-orb");
  if(b.isTrainer){ orbBtn.disabled=true; orbBtn.title="Can't catch a trainer's beast"; }
  mk("BAG",async()=>{ const used=await openBag(true); if(used && S.battle && !S.battle.over) await enemyFreeTurn(); else if(S.battle&&!S.battle.over) cmdMain(); });
  mk("TEAM",async()=>{ const done=await cmdSwitch(false); if(done && S.battle && !S.battle.over) await enemyFreeTurn(); else if(S.battle&&!S.battle.over) cmdMain(); });
  const runBtn=mk("RUN",()=>cmdRun(),"cmd-run");
  if(b.isTrainer){ runBtn.disabled=true; runBtn.title="No running from trainer battles"; }
  c.appendChild(grid);
}

function cmdMoves(){
  const b=S.battle, mon=b.pmon;
  const c=$("#cmd"); c.innerHTML="";
  const grid=el("div","cmd-grid");
  mon.moves.forEach(k=>{
    const m=MOVES[k];
    const eff = m.p ? effMult(m.t,SPECIES[b.emon.id].t) : 1;
    const effTag = !m.p?"": eff>1?'<span class="eff-up">&#9650;</span>': eff<1?'<span class="eff-dn">&#9660;</span>':"";
    const btn=el("button","btn cmd-btn move-btn",
      `<span class="chip" style="background:${TYPE_COLORS[m.t]}">${m.t==="NONE"?"NORM":m.t}</span> ${esc(m.n)} ${effTag}<br><span class="opt-sub">${m.p?("PWR "+m.p+" &middot; ACC "+m.acc):"STATUS"}</span>`);
    btn.onclick=()=>{ sfx.click(); doRound(k); };
    grid.appendChild(btn);
  });
  const back=el("button","btn btn-ghost","&larr; BACK");
  back.onclick=()=>{sfx.click();cmdMain();};
  c.appendChild(grid); c.appendChild(back);
}

async function cmdOrb(){
  const orbs=["greatorb","orb"].filter(k=>S.bag[k]>0);
  if(!orbs.length){ await say("You're out of orbs!",{fast:true}); cmdMain(); return; }
  let key=orbs[orbs.length-1];
  if(orbs.length>1){
    const c=await modalChoice("Throw which orb?",orbs.map(k=>({html:`<b>${esc(ITEMS[k].n)}</b> &times;${S.bag[k]}`})));
    if(c<0){ cmdMain(); return; }
    key=orbs[c];
  }
  S.bag[key]--;
  cmdClear();
  await throwOrb(ITEMS[key].pow);
}

async function cmdRun(){
  const b=S.battle;
  cmdClear();
  const chance=clamp(0.6+(effSpd(b.pmon)-effSpd(b.emon))/200,0.35,0.95);
  if(Math.random()<chance){
    await say("You got away safely!");
    endBattle("fled");
  } else {
    await say("Couldn't escape!");
    await enemyFreeTurn();
  }
}

/* switch: returns true if switched */
function cmdSwitch(forced){
  return new Promise(async res=>{
    const opts=S.team.map((m,i)=>{
      const sp=SPECIES[m.id];
      return {html:`<b>${esc(sp.n)}</b> Lv${m.lvl} &middot; ${Math.max(0,m.curHP)}/${m.maxHP} HP`,
              disabled: m.curHP<=0 || m===S.battle.pmon};
    });
    const c=await modalChoice(forced?"Choose your next beast!":"Switch to...",opts,{cancel:!forced});
    if(c<0) return res(false);
    const mon=S.team[c];
    S.team.splice(c,1); S.team.unshift(mon);
    S.battle.pmon=mon;
    mon.stages={atk:0,def:0,spd:0};
    resetAnim("p");
    renderInfos();
    await say(`Go, ${SPECIES[mon.id].n}!`);
    res(true);
  });
}

/* ---------- start battle ---------- */
async function startBattle(cfg){
  const isPack = Array.isArray(cfg.pack) && cfg.pack.length>0;
  const b = S.battle = {
    isTrainer:!!cfg.trainer,
    isPack,
    trainer:cfg.trainer||null,
    queue: cfg.trainer ? cfg.trainer.team.slice() : (isPack ? cfg.pack.slice() : null),
    emon:null, pmon:null,
    over:false, turn:0, sturdyUsed:false
  };
  const lead=firstAlive();
  if(lead<0){ return; }
  const m=S.team.splice(lead,1)[0]; S.team.unshift(m);
  b.pmon=S.team[0];
  b.pmon.stages={atk:0,def:0,spd:0};
  b.emon = (b.isTrainer||isPack) ? b.queue.shift() : cfg.wild;
  markSeen(b.emon);
  S.stats.battles++;
  renderBattleShell();
  resetAnim("p"); resetAnim("e");
  renderInfos();
  show("battle");
  startBattleLoop();
  cmdClear();
  if(b.isTrainer){
    await say(`${b.trainer.name} wants to battle!`);
    await say(`"${b.trainer.quote}"`);
    await say(`${b.trainer.name} sent out ${SPECIES[b.emon.id].n}!`);
  } else if(isPack){
    await say(`A wild pack appeared! ${SPECIES[b.emon.id].n} steps forward! (Lv${b.emon.lvl})`);
  } else {
    await say(`A wild ${SPECIES[b.emon.id].n} appeared! (Lv${b.emon.lvl})`);
  }
  await say(`Go, ${SPECIES[b.pmon.id].n}!`,{fast:true});
  if(S.charms.furyCharm){
    b.pmon.stages.atk=clamp(b.pmon.stages.atk+1,-6,6);
    sfx.buff();
    await say(`The Fury Charm burns! ${SPECIES[b.pmon.id].n}'s ATK rose!`,{fast:true});
  }
  cmdMain();
}

/* ---------- turn resolution ---------- */
async function doRound(playerMoveKey){
  const b=S.battle;
  cmdClear();
  S.stats.turns++;
  const eMove=aiPickMove(b.emon,b.pmon);
  const pFirst=(()=>{
    const pm=MOVES[playerMoveKey], em=MOVES[eMove];
    const pp=pm.pri||0, ep=em.pri||0;
    if(pp!==ep) return pp>ep;
    const ps=effSpd(b.pmon), es=effSpd(b.emon);
    if(ps!==es) return ps>es;
    return Math.random()<0.5;
  })();
  const order=pFirst?[["p",playerMoveKey],["e",eMove]]:[["e",eMove],["p",playerMoveKey]];
  for(const [side,mk] of order){
    if(b.over) return;
    const att=side==="p"?b.pmon:b.emon;
    const dfn=side==="p"?b.emon:b.pmon;
    if(att.curHP<=0) continue;
    await execMove(side,att,dfn,mk);
    if(b.over) return;
    if(await handleFaints()) return;
  }
  /* end of turn status */
  for(const side of ["p","e"]){
    const mon=side==="p"?b.pmon:b.emon;
    const tick=statusTick(mon);
    if(tick){
      ANIM[side].flash=performance.now();
      renderInfos();
      await say(`${SPECIES[mon.id].n} ${tick.txt}`,{fast:true});
      if(await handleFaints()) return;
    }
  }
  await trinketTick();
  if(!b.over) cmdMain();
}

/* end-of-turn trinkets on the player's active beast */
async function trinketTick(){
  const b=S.battle; if(!b||b.over) return;
  const m=b.pmon; if(!m||m.curHP<=0) return;
  if(m.trinket==="lifeleaf" && m.curHP<m.maxHP){
    m.curHP=Math.min(m.maxHP,m.curHP+Math.max(1,Math.floor(m.maxHP*0.06)));
    renderInfos();
  }
  if(m.trinket==="shedbell" && m.status && Math.random()<0.3){
    const s=statusName(m.status);
    m.status=null; sfx.heal(); renderInfos();
    await say(`${SPECIES[m.id].n}'s Shed Bell rang! It shook off being ${s}!`,{fast:true});
  }
}

async function enemyFreeTurn(){
  const b=S.battle;
  if(!b||b.over) return;
  cmdClear();
  const mk=aiPickMove(b.emon,b.pmon);
  if(b.emon.curHP>0){
    await execMove("e",b.emon,b.pmon,mk);
    if(await handleFaints()) return;
  }
  const tick=statusTick(b.emon);
  if(tick){ renderInfos(); await say(`${SPECIES[b.emon.id].n} ${tick.txt}`,{fast:true}); if(await handleFaints()) return; }
  const tick2=statusTick(b.pmon);
  if(tick2){ renderInfos(); await say(`${SPECIES[b.pmon.id].n} ${tick2.txt}`,{fast:true}); if(await handleFaints()) return; }
  await trinketTick();
  if(!b.over) cmdMain();
}

async function execMove(side,att,dfn,moveKey){
  const b=S.battle, mv=MOVES[moveKey];
  const attName=SPECIES[att.id].n, dfnName=SPECIES[dfn.id].n;
  if(att.status==="PAR" && Math.random()<0.25){
    await say(`${attName} is paralyzed and can't move!`);
    return;
  }
  await say(`${attName} used ${mv.n}!`,{fast:true});
  ANIM[side].lunge=performance.now();
  if(Math.random()*100>mv.acc){
    await say("The attack missed!",{fast:true});
    return;
  }
  if(mv.p>0){
    const nHits = mv.hits ? irnd(mv.hits[0],mv.hits[1]) : 1;
    const dside=side==="p"?"e":"p";
    let totalDmg=0, anyCrit=false, lastEff=1, sturdied=false, landed=0;
    for(let h=0;h<nHits && dfn.curHP>0;h++){
      const r=calcDamage(att,dfn,moveKey,side==="p",S.charms);
      const preHP=dfn.curHP;
      dfn.curHP=Math.max(0,dfn.curHP-r.dmg);
      if(side==="e" && dfn.curHP===0 && preHP>1 && S.charms.sturdyCharm && !b.sturdyUsed){
        dfn.curHP=1; b.sturdyUsed=true; sturdied=true;
      }
      totalDmg+=r.dmg; anyCrit=anyCrit||r.crit; lastEff=r.eff; landed++;
      ANIM[dside].flash=performance.now();
      ANIM[dside].shake=performance.now();
      if(r.eff>1) sfx.superhit(); else if(r.eff<1) sfx.weak(); else sfx.hit();
      popDamage(dside, r.dmg, r.crit, r.eff);
      if(r.eff>1||r.crit) stageShake();
      renderInfos();
      await sleep(nHits>1?240:320);
    }
    if(nHits>1) await say(`Hit ${landed} time${landed>1?"s":""}!`,{fast:true});
    if(anyCrit) await say("A critical hit!",{fast:true});
    if(lastEff>1) await say("It's super effective!",{fast:true});
    else if(lastEff<1) await say("It's not very effective...",{fast:true});
    if(sturdied){ sfx.buff(); await say(`${dfnName} held on with the Sturdy Charm!`); }
    if(mv.drain && totalDmg>0 && att.curHP>0 && att.curHP<att.maxHP){
      att.curHP=Math.min(att.maxHP, att.curHP+Math.max(1,Math.floor(totalDmg*mv.drain)));
      sfx.heal(); renderInfos();
      await say(`${attName} drained the energy!`,{fast:true});
    }
    if(mv.recoil && totalDmg>0){
      att.curHP=Math.max(0, att.curHP-Math.max(1,Math.floor(totalDmg*mv.recoil)));
      ANIM[side].flash=performance.now();
      renderInfos();
      await say(`${attName} is hit by recoil!`,{fast:true});
    }
  }
  if(mv.fx && dfn.curHP>0){
    const fx=mv.fx;
    const roll = fx.ch==null || Math.random()<fx.ch;
    if(roll){
      if(fx.heal){
        const h=Math.floor(att.maxHP*fx.heal);
        if(att.curHP<att.maxHP){
          att.curHP=Math.min(att.maxHP,att.curHP+h);
          sfx.heal(); renderInfos();
          await say(`${attName} restored its HP!`,{fast:true});
        } else await say("But its HP is already full!",{fast:true});
      } else if(fx.stat){
        const target=fx.self?att:dfn;
        const before=target.stages[fx.stat];
        target.stages[fx.stat]=clamp(before+fx.d,-6,6);
        if(target.stages[fx.stat]!==before){
          (fx.d>0?sfx.buff:sfx.debuff)();
          const tn=SPECIES[target.id].n;
          await say(`${tn}'s ${fx.stat.toUpperCase()} ${fx.d>0?"rose":"fell"}!`,{fast:true});
        }
      } else if(fx.status && !dfn.status){
        dfn.status=fx.status;
        renderInfos();
        await say(`${dfnName} was ${statusName(fx.status)}!`,{fast:true});
      }
    }
  }
}

/* returns true if battle flow should stop (ended or awaiting async continue) */
async function handleFaints(){
  const b=S.battle;
  if(b.emon.curHP<=0){
    ANIM.e.hidden=true; sfx.faint();
    await say(`${SPECIES[b.emon.id].n} fainted!`);
    await awardXP(b.emon);
    if((b.isTrainer||b.isPack) && b.queue.length){
      b.emon=b.queue.shift();
      markSeen(b.emon);
      resetAnim("e");
      renderInfos();
      if(b.isTrainer) await say(`${b.trainer.name} sent out ${SPECIES[b.emon.id].n}!`);
      else await say(`Another wild ${SPECIES[b.emon.id].n} appeared!`);
      if(b.pmon.curHP<=0) return await playerFaintFlow();
      cmdMain();
      return true;
    }
    await battleWon();
    return true;
  }
  if(b.pmon.curHP<=0) return await playerFaintFlow();
  return false;
}

async function playerFaintFlow(){
  const b=S.battle;
  ANIM.p.hidden=true; sfx.faint();
  S.stats.faints++;
  await say(`${SPECIES[b.pmon.id].n} fainted!`);
  if(firstAlive()<0){
    await runOver();
    return true;
  }
  await cmdSwitch(true);
  ANIM.p.hidden=false;
  if(!b.over) cmdMain();
  return true;
}

async function awardXP(downed){
  const b=S.battle;
  let amt=xpYield(downed,b.isTrainer);
  if(S.charms.xpCharm) amt=Math.floor(amt*1.25);
  const bench=S.team.filter(m=>m!==b.pmon && m.curHP>0);
  const targets=[[b.pmon,amt],...bench.map(m=>[m,Math.floor(amt*0.3)])];
  for(const [mon,xp] of targets){
    if(mon.curHP<=0||xp<=0) continue;
    const gain = mon.trinket==="mentorscarf" ? Math.floor(xp*1.3) : xp;
    if(mon===b.pmon) await say(`${SPECIES[mon.id].n} gained ${gain} XP!`,{fast:true});
    const evs=grantXP(mon,gain);
    renderInfos();
    for(const ev of evs) await narrateXPEvent(mon,ev,false);
  }
}

async function narrateXPEvent(mon,ev,silentish){
  const nm=SPECIES[mon.id].n;
  if(ev.type==="level"){
    sfx.level();
    renderInfos();
    await say(`${nm} grew to Lv${ev.lvl}!`,{fast:true});
  } else if(ev.type==="learned"){
    await say(`${nm} learned ${MOVES[ev.move].n}!`);
  } else if(ev.type==="wantslearn"){
    await moveLearnPrompt(mon,ev.move);
  }
}

function moveLearnPrompt(mon,newKey){
  return new Promise(async res=>{
    const nm=SPECIES[mon.id].n, nmv=MOVES[newKey];
    const opts=mon.moves.map(k=>{const m=MOVES[k];
      return {html:`Forget <b>${esc(m.n)}</b> <span class="opt-sub">${m.p?("PWR "+m.p):"STATUS"} ${m.t}</span>`};});
    opts.push({html:`<b>Skip learning ${esc(nmv.n)}</b>`,cls:"btn-ghost"});
    const c=await modalChoice(`${nm} wants to learn ${nmv.n}!`,opts,
      {sub:`${nmv.n}: ${nmv.p?("PWR "+nmv.p+", ACC "+nmv.acc):"Status move"}, ${nmv.t} type. But ${nm} already knows 4 moves.`,cancel:false});
    if(c>=0 && c<mon.moves.length){
      const old=MOVES[mon.moves[c]].n;
      mon.moves[c]=newKey;
      await say(`${nm} forgot ${old} and learned ${nmv.n}!`);
    } else {
      await say(`${nm} did not learn ${nmv.n}.`,{fast:true});
    }
    res();
  });
}

async function maybeEvolve(mon){
  const to=checkEvolution(mon);
  if(!to) return;
  const c=await modalChoice(`What? ${SPECIES[mon.id].n} is evolving!`,
    [{label:"Let it evolve!"},{label:"Not yet",cls:"btn-ghost"}],{cancel:false});
  if(c!==0) return;
  const from=SPECIES[mon.id].n;
  evolveMon(mon,to);
  S.stats.evolutions++;
  sfx.badge();
  const box=el("div","panel modal-box evo-box");
  box.innerHTML=`<div class="modal-title">EVOLUTION</div>
    <canvas width="128" height="128"></canvas>
    <div class="modal-sub">${esc(from)} evolved into <b style="color:${TYPE_COLORS[SPECIES[to].t]}">${esc(SPECIES[to].n)}</b>!</div>
    <button class="btn" id="evo-ok">AMAZING</button>`;
  const ctx=box.querySelector("canvas").getContext("2d");
  ctx.imageSmoothingEnabled=false;
  drawSprite(ctx,to,0,0,8,false,{});
  showModal(box);
  await new Promise(r=>{$("#evo-ok").onclick=()=>{sfx.click();closeModal();r();};});
}

/* ---------- catching ---------- */
async function throwOrb(pow){
  const b=S.battle;
  sfx.orb();
  await say(`You threw an orb at ${SPECIES[b.emon.id].n}!`,{fast:true});
  const r=catchRoll(b.emon,pow,S.charms);
  ANIM.e.hidden=true;
  for(let i=0;i<Math.max(1,r.shakes);i++){
    await say("..."+(i+1),{fast:true});
    beep(300-i*40,.08,"sine",.04);
  }
  if(r.caught){
    sfx.catch();
    S.stats.catches++;
    const caught=b.emon;
    markCaught(caught);
    await say(`Gotcha! ${SPECIES[caught.id].n} was caught!`);
    if(caught.prime) await say(`It's a Prime ${SPECIES[caught.id].n}! A rare and powerful find.`);
    caught.stages={atk:0,def:0,spd:0};
    if(S.team.length<6){
      S.team.push(caught);
      await say(`${SPECIES[caught.id].n} joined your team!`,{fast:true});
    } else {
      const c=await modalChoice("Your team is full!",[
        ...S.team.map(m=>({html:`Swap out <b>${esc(SPECIES[m.id].n)}</b> Lv${m.lvl}`})),
        {html:`<b>Release ${esc(SPECIES[caught.id].n)}</b>`,cls:"btn-ghost"}
      ],{cancel:false});
      if(c>=0 && c<S.team.length){
        const out=S.team[c];
        S.team[c]=caught;
        await say(`${SPECIES[out.id].n} was released. ${SPECIES[caught.id].n} joined your team!`);
      } else {
        await say(`${SPECIES[caught.id].n} was released.`,{fast:true});
      }
    }
    endBattle("caught");
    await postVictory(false);
  } else {
    ANIM.e.hidden=false;
    await say(`Oh no! ${SPECIES[b.emon.id].n} broke free!`);
    await enemyFreeTurn();
  }
}

/* ---------- battle end ---------- */
function endBattle(){
  if(S.battle) S.battle.over=true;
  S.battle=null;
  stopBattleLoop();
}

async function battleWon(){
  const b=S.battle;
  const wasTrainer=b.isTrainer, kind=wasTrainer?b.trainer.kind:null, tname=wasTrainer?b.trainer.name:null;
  if(wasTrainer) await say(`You defeated ${tname}!`);
  endBattle();
  /* breather: surviving team catches its breath after a win */
  const breather = kind==="champion" ? 0 : 0.30;
  if(breather>0){
    S.team.forEach(m=>{ if(m.curHP>0) m.curHP=Math.min(m.maxHP,m.curHP+Math.floor(m.maxHP*breather)); });
  }
  if(S.charms.heartCharm){
    S.team.forEach(m=>{ if(m.curHP>0) m.curHP=Math.min(m.maxHP,m.curHP+Math.floor(m.maxHP*0.15)); });
  }
  for(const mon of S.team){ if(mon.curHP>0) await maybeEvolve(mon); }
  await postVictory(kind);
}

async function postVictory(kind){
  const node = S.pendingNode; S.pendingNode=null;
  if(node) node.done=true;
  if(kind==="rival"){
    S.stats.rivals=(S.stats.rivals||0)+1;
    META.rivalWins=(META.rivalWins||0)+1;
    saveMeta();
  }
  const sh = shardFor(kind,node);
  if(sh>0) S.shards += sh;
  const shNote = sh>0 ? `+${sh} shards` : "";
  checkAchievements();

  if(kind==="champion"){ renderVictory(); return; }

  if(kind==="gym"){
    S.badges++;
    sfx.badge();
    healTeamFull();
    await modalChoice(`BADGE ${S.badges} EARNED!`,[{label:"Onward!"}],
      {sub:`${shNote}. Your whole team was fully healed.`,cancel:false});
    showRewards(true,()=>{ advanceRegion(); }, shNote);
    return;
  }
  if(kind==="elite"){
    sfx.badge();
    showRewards(true,()=>{ backToMap(); }, shNote);
    return;
  }
  if(kind==="rival"){
    sfx.badge();
    showRewards(true,()=>{ backToMap(); }, shNote+" · Rival bounty!", {guaranteeCharm:true});
    return;
  }
  /* wild / pack / event battle */
  showRewards(false,()=>{ backToMap(); }, shNote);
}

  pack:    {g:"&#9876;&#9876;",  label:"Pack",     col:"#e8683a"},

/* ---------- generic helpers ---------- */
function weightedPick(pairs){
  const tot=pairs.reduce((s,p)=>s+p[1],0); let r=Math.random()*tot;
  for(const p of pairs){ r-=p[1]; if(r<=0) return p[0]; } return pairs[0][0];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nodeById(id){ return S.region ? S.region.nodes.find(n=>n.id===id) : null; }
function reachableIds(){
  if(!S.region) return [];
  if(S.pos==null) return S.region.entries.slice();
  const cur=nodeById(S.pos); return cur ? cur.to.slice() : [];
}

/* ---------- economy helpers ---------- */
function shardFor(kind,node){
  const r=S.zoneIdx;
  let sh;
  if(kind==="gym") sh=45+r*3;
  else if(kind==="rival") sh=32+r*3+irnd(0,8);
  else if(kind==="elite") sh=50;
  else if(kind==="champion") sh=0;
  else{
    const t=node?node.type:"wild";
    sh = t==="pack" ? 18+r*2+irnd(0,6) : 8+r*2+irnd(0,4);
  }
  if(S.charms.prospectCharm) sh=Math.floor(sh*1.3);
  return sh;
}
function healTeamFull(){ S.team.forEach(m=>{ m.curHP=m.maxHP; m.status=null; }); }
function healTeamFrac(f){ S.team.forEach(m=>{ if(m.curHP>0) m.curHP=Math.min(m.maxHP,m.curHP+Math.floor(m.maxHP*f)); }); }
function damageTeamFrac(f){ S.team.forEach(m=>{ if(m.curHP>0) m.curHP=Math.max(1,m.curHP-Math.floor(m.maxHP*f)); }); }
function giveItem(k,n){ S.bag[k]=(S.bag[k]||0)+(n||1); }
function giveShards(n){ S.shards+=n; }
function loseShards(n){ S.shards=Math.max(0,S.shards-n); }
function randomCharmKey(){ const a=Object.keys(CHARMS).filter(c=>!S.charms[c]); return a.length?pick(a):null; }
function giveRandomCharm(){ const k=randomCharmKey(); if(k){ S.charms[k]=true; return CHARMS[k].n; } return null; }

async function addBeastToTeam(mon){
  if(S.team.length<6){ S.team.push(mon); return true; }
  const c=await modalChoice("Your team is full!",[
    ...S.team.map(m=>({html:`Swap out <b>${esc(SPECIES[m.id].n)}</b> Lv${m.lvl}`})),
    {html:"<b>Turn it away</b>",cls:"btn-ghost"}
  ],{cancel:false});
  if(c>=0 && c<S.team.length){ S.team[c]=mon; return true; }
  return false;
}

function buildPack(ri,off){ off=off||0; return [ buildWild(ri,off+2), buildWild(ri,off+2) ]; }

/* ============================================================
   REGION MAP GENERATION
   ============================================================ */
function genRegion(ri){
  /* 5 rows of 2-3 nodes each, plus the gym at the top.
     Every row has at least two nodes, so every step of a run
     is a real routing choice, Slay-the-Spire style. */
  const ROWS=5, colX=[20,50,80];
  const byRow=[], nodes=[]; let id=0;
  for(let r=0;r<ROWS;r++){
    /* bias toward wide rows: 3 nodes ~60% of the time, never fewer than 2 */
    const n = Math.random()<0.6 ? 3 : 2;
    const cols = n===3 ? [0,1,2]
      : shuffle([[0,1],[1,2],[0,2],[0,2]]).pop().slice().sort((a,b)=>a-b);
    byRow[r]=cols.map(c=>{
      const node={id:id++, r, c, type:null, to:[], done:false, x:colX[c], y:88-r*16.5};
      nodes.push(node); return node;
    });
  }
  /* crossing-free linking: walk both rows left-to-right with two pointers.
     Advancing only the child pointer forks a path; advancing only the
     parent pointer merges paths. Every node gets at least one link. */
  for(let r=0;r<ROWS-1;r++){
    const P=byRow[r], C=byRow[r+1];
    let i=0, j=0;
    P[i].to.push(C[j].id);
    while(i<P.length-1 || j<C.length-1){
      const canI=i<P.length-1, canJ=j<C.length-1;
      if(canI && canJ){
        const roll=Math.random();
        if(roll<0.5) j++;           /* fork: same parent, next child */
        else if(roll<0.62){ i++; j++; }
        else i++;                   /* merge: next parent, same child */
      }
      else if(canI) i++;
      else j++;
      if(!P[i].to.includes(C[j].id)) P[i].to.push(C[j].id);
    }
    /* post-pass: single-exit nodes try to grab a second path
       whenever the geometry allows it without crossing another edge */
    const cById={}; C.forEach(c=>cById[c.id]=c);
    const edgeCols=()=>{ const e=[]; P.forEach(p=>p.to.forEach(t=>{ if(cById[t]) e.push([p.c,cById[t].c]); })); return e; };
    P.forEach(p=>{
      if(p.to.length>1 || Math.random()>=0.8) return;
      const have=new Set(p.to);
      const cands=shuffle(C.filter(c=>!have.has(c.id)));
      for(const c of cands){
        const cross=edgeCols().some(([qc,dc])=>(p.c-qc)*(c.c-dc)<0);
        if(!cross){ p.to.push(c.id); break; }
      }
    });
  }
  const boss={id:id++, r:ROWS, c:1, type:"boss", to:[], done:false, x:50, y:6};
  nodes.push(boss);
  byRow[ROWS-1].forEach(n=>n.to.push(boss.id));
  assignTypes(nodes,byRow,ri);
  return {ri, nodes, boss:boss.id, entries:byRow[0].map(n=>n.id), rows:ROWS};
}

function assignTypes(nodes,byRow,ri){
  const pool=[["wild",42],["event",17],["pack",13],["treasure",11],["rest",9],["shop",6]];
  nodes.forEach(n=>{
    if(n.type==="boss") return;
    if(n.r===0){ n.type = (ri===0) ? "wild" : (Math.random()<0.72?"wild":"event"); return; }
    n.type = weightedPick(pool);
  });
  const nonBoss=nodes.filter(n=>n.type!=="boss");
  /* early regions: no packs (too swingy against a small starting team) */
  if(ri<2) nonBoss.forEach(n=>{ if(n.type==="pack") n.type="wild"; });
  if(!nonBoss.some(n=>n.type==="rest")){
    const last=byRow[byRow.length-1];
    (pick(last)||pick(nonBoss)).type="rest";
  }
  let shopSeen=false;
  nonBoss.forEach(n=>{ if(n.type==="shop"){ if(shopSeen) n.type="wild"; else shopSeen=true; } });
  /* rivals: from region 3 onward, one avoidable elite fight sits on a
     wide middle row. Big risk, big payout. */
  if(ri>=2){
    const rows=byRow.filter(row=>row.length>=2 && row[0].r>=1 && row[0].r<=3);
    if(rows.length){
      const row=pick(rows);
      const cand=row.filter(n=>n.type!=="rest" && n.type!=="shop");
      const n=cand.length?pick(cand):pick(row);
      n.type="rival";
      n.rivalIdx=Math.floor(Math.random()*RIVALS.length);
    }
  }
}

function startAdventure(){ S.zoneIdx=0; S.phase="zones"; enterRegion(0); }

function regionIntro(eyebrow,title,lore,skyA,skyB,extra){

function enterRegion(ri){
  S.zoneIdx=ri; S.phase="zones";
  S.region=genRegion(ri); S.pos=null; S.pendingNode=null;
  saveRun();
  const z=ZONES[ri];
  regionIntro(`REGION ${ri+1} OF 8`, z.name, REGION_LORE[ri]||"",

    `<div class="region-leader">Gym Leader: <b>${esc(z.gym.name)}</b> &middot; ${z.gym.t}</div>`);
}

function advanceRegion(){
  const next=S.zoneIdx+1;
  if(next>=ZONES.length) enterLeague();
  else enterRegion(next);
}

function enterLeague(){
  S.phase="league"; S.zoneIdx=ZONES.length;
  healTeamFull();
  const nodes=[]; let id=0;
  const chain=[["elite",0],["elite",1],["elite",2],["elite",3],["champion",null]];
  chain.forEach(([t,ei],i)=>{
    nodes.push({id:id++, r:i, c:1, type:t, eliteIdx:ei, to:[], done:false, x:50, y:82-i*17});
  });
  for(let i=0;i<nodes.length-1;i++) nodes[i].to=[nodes[i+1].id];
  S.region={ri:8, league:true, nodes, entries:[nodes[0].id], boss:nodes[nodes.length-1].id, rows:nodes.length};
  S.pos=null; S.pendingNode=null; saveRun();
  regionIntro("THE FINAL CHALLENGE","The League",
    "Four Elites stand between you and the Champion. Your team is fully healed, but there is no healing between the Elite battles. Steady your nerves.",
    "#141024","#3d3060");
}

/* ============================================================

   ============================================================ */
function renderMap(){
  const scr=$("#scr-map");
  if(!S.region){ return; }
  const league=S.phase==="league";
  const z=league?null:ZONES[S.zoneIdx];
  const reg=S.region;
  const reach=new Set(reachableIds());
  const skyA=league?"#141024":z.sky[0], skyB=league?"#3d3060":z.sky[1];

  let lines="";
  reg.nodes.forEach(n=>{
    n.to.forEach(tid=>{
      const t=nodeById(tid); if(!t) return;
      const on = n.done || S.pos===n.id;
      lines+=`<line x1="${n.x}" y1="${n.y}" x2="${t.x}" y2="${t.y}" class="edge${on?" edge-on":""}"/>`;
    });
  });

  let nodesHtml="";
  reg.nodes.forEach(n=>{
    const meta=NODE_META[n.type]||NODE_META.wild;
    const isReach=reach.has(n.id) && !n.done;
    const isCur=S.pos===n.id;
    const state=n.done?"done":isCur?"cur":isReach?"reach":"lock";
    const rival=n.type==="rival" && !n.done ? " rivalnode" : "";
    nodesHtml+=`<button class="mapnode ${state}${rival}" data-id="${n.id}" style="left:${n.x}%;top:${n.y}%;--nc:${meta.col}" ${isReach?"":"disabled"}>
      <span class="mn-g">${n.done?"&#10004;":meta.g}</span>
      ${n.done?"":`<span class="mn-l">${meta.label}</span>`}
    </button>`;
  });

  const badges=Array.from({length:8},(_,i)=>`<span class="badge ${i<S.badges?"got":""}">&#9679;</span>`).join("");
  const title=league?"THE LEAGUE":`REGION ${S.zoneIdx+1}: ${z.name.toUpperCase()}`;
  const hint = S.pos==null ? "Plan a route, then choose where to begin." : (reach.size ? "Choose your next path." : "");

  scr.innerHTML=`
    <div class="map-top" style="background:linear-gradient(${skyA},${skyB})">
      <div class="map-topbar">
        <span class="shard-hud">&#9670; ${S.shards}</span>
        <div class="badge-row">${badges}</div>
        <span class="diff-badge">${esc((DIFFICULTY[S.difficulty]||DIFFICULTY.standard).n.toUpperCase())}</span>
      </div>
      <h2 class="scr-h map-h">${title}</h2>
      <div class="map-hint">${hint}</div>
      <div class="map-canvas" id="map-canvas">
        <svg class="map-svg" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>
        ${nodesHtml}
      </div>
    </div>
    <div class="map-lower">
      <div class="team-strip" id="map-team"></div>
      <div class="map-btnrow">
        <button class="btn btn-ghost" id="btn-bag">BAG</button>
        <button class="btn btn-ghost" id="btn-charms">CHARMS</button>
        <button class="btn btn-ghost" id="btn-team">TEAM</button>
        <button class="btn btn-mini" id="btn-mhelp">?</button>
        <button class="btn btn-mini" id="btn-speed">${S.speed}x</button>
        <button class="btn btn-mini" id="btn-mute">${S.muted?"&#128263;":"&#128266;"}</button>
      </div>
    </div>`;
  renderTeamStrip("#map-team");
  scr.querySelectorAll(".mapnode:not([disabled])").forEach(btn=>{
    btn.onclick=()=>{ sfx.click(); travelTo(+btn.dataset.id); };
  });
  $("#btn-bag").onclick=()=>openBag(false);
  $("#btn-charms").onclick=openCharms;
  $("#btn-team").onclick=()=>openMonSheet(0,"#map-team");
  $("#btn-mhelp").onclick=showHelp;
  $("#btn-speed").onclick=()=>{ S.speed=S.speed===1?2:1; renderMap(); };
  $("#btn-mute").onclick=()=>{ S.muted=!S.muted; renderMap(); };
  saveRun();
}

/* ============================================================
   NODE TRAVEL + HANDLERS
   ============================================================ */
function travelTo(id){
  if(!reachableIds().includes(id)) return;
  const node=nodeById(id); if(!node) return;
  S.pos=id; S.stats.nodes++;
  runNode(node);
}
function runNode(node){
  switch(node.type){
    case "wild":     doWildNode(node); break;
    case "pack":     doPackNode(node); break;
    case "rival":    doRivalNode(node); break;
    case "boss":     doBossNode(node); break;
    case "elite":    doEliteNode(node); break;
    case "champion": doChampionNode(node); break;
    case "rest":     renderRest(node); break;
    case "shop":     renderShop(node); break;
    case "treasure": doTreasure(node); break;
    case "event":    doEvent(node); break;
    default:         completeNode(node);
  }
}
function completeNode(node){ node.done=true; saveRun(); checkAchievements(); renderMap(); show("map"); }
function backToMap(){ renderMap(); show("map"); }

function doWildNode(node){ S.pendingNode=node; startBattle({wild:buildWild(S.zoneIdx,diffOff())}); }
function doPackNode(node){ S.pendingNode=node; startBattle({pack:buildPack(S.zoneIdx,diffOff())}); }
function doRivalNode(node){
  const rv=RIVALS[node.rivalIdx!=null?node.rivalIdx:Math.floor(Math.random()*RIVALS.length)];
  const z=ZONES[S.zoneIdx], lv=z.gym.lv-1;
  const ids=shuffle(z.pool.slice());
  const team=[[ids[0],lv],[ids[1%ids.length],lv],[ids[2%ids.length],lv+1]];
  S.pendingNode=node;
  startBattle({trainer:{name:rv.name,quote:rv.quote,team:buildTrainerTeam({team},diffOff()),kind:"rival"}});
}
function doBossNode(node){
  const g=ZONES[S.zoneIdx].gym; S.pendingNode=node;
  startBattle({trainer:{name:g.name,quote:g.quote,team:buildTrainerTeam(g,diffOff()),kind:"gym"}});
}
function doEliteNode(node){
  const e=ELITE[node.eliteIdx]; S.pendingNode=node;
  startBattle({trainer:{name:e.name,quote:e.quote,team:buildTrainerTeam(e,diffOff()),kind:"elite"}});
}
function doChampionNode(node){
  healTeamFull(); S.pendingNode=node;
  startBattle({trainer:{name:CHAMPION.name,quote:CHAMPION.quote,team:buildTrainerTeam(CHAMPION,diffOff()),kind:"champion"}});
}
function doTreasure(node){ showRewards(true, ()=>completeNode(node), "A hidden cache!"); }

/* ---------- rest site ---------- */
function renderRest(node){
  const scr=$("#scr-rest");
  scr.innerHTML=`
    <div class="site-wrap">
      <h2 class="scr-h">A PLACE TO REST</h2>
      <div class="site-desc">A safe clearing. Take a moment before pressing on. You may do one thing here.</div>
      <div class="site-opts" id="rest-opts"></div>
    </div>`;
  const opts=$("#rest-opts");
  const mk=(title,desc,fn)=>{
    const b=el("button","panel site-card");
    b.innerHTML=`<div class="site-name">${title}</div><div class="dex">${desc}</div>`;
    b.onclick=async()=>{ sfx.click(); await fn(); completeNode(node); };
    opts.appendChild(b);
  };
  mk("Rest","Fully heal your whole team.", async()=>{ sfx.heal(); healTeamFull(); });
  mk("Train","Pick one beast to gain a level (it may evolve).", async()=>{
    const c=await modalChoice("Train which beast?", S.team.map(m=>({html:`<b>${esc(SPECIES[m.id].n)}</b> Lv${m.lvl}`})));
    if(c>=0){ const m=S.team[c]; sfx.level();
      const evs=grantXP(m, xpToNext(m.lvl)-m.xp);
      for(const ev of evs) await narrateXPEvent(m,ev,true);
      await maybeEvolve(m);
    }
  });
  mk("Tend","Cure all status conditions and heal 40% HP.", async()=>{ sfx.heal(); S.team.forEach(m=>{ m.status=null; }); healTeamFrac(0.4); });
  show("rest");
}

/* ---------- shop ---------- */
function shopStock(){
  const stock=[
    {key:"potion",price:15},{key:"superpotion",price:32},{key:"revive",price:38},
    {key:"orb",price:12},{key:"greatorb",price:30},{key:"candy",price:48},
    {key:"elixir",price:52},
    {key:pick(["xattack","xdefense","xspeed"]),price:20},
    {key:pick(Object.keys(TRINKETS)),price:45,trink:true}
  ];
  const ch=randomCharmKey(); if(ch) stock.push({key:ch,price:80,charm:true});
  return stock;
}
function renderShop(node){
  if(!node._stock) node._stock=shopStock();
  const scr=$("#scr-shop");
  const rows=node._stock.map((s,i)=>{
    const info=s.charm?CHARMS[s.key]:s.trink?TRINKETS[s.key]:ITEMS[s.key];
    const afford=S.shards>=s.price && !s.bought;
    const tag=s.charm?' <span class="chip chip-prime">CHARM</span>':s.trink?' <span class="chip trink-chip">TRINKET</span>':"";
    return `<div class="shop-row ${s.bought?"sold":""}">
      <div class="shop-info"><b>${esc(info.n)}</b>${tag}<br><span class="opt-sub">${esc(info.d)}</span></div>
      <button class="btn shop-buy" data-i="${i}" ${afford?"":"disabled"}>${s.bought?"SOLD":"&#9670; "+s.price}</button>
    </div>`;
  }).join("");
  scr.innerHTML=`
    <div class="site-wrap">
      <h2 class="scr-h">WANDERING MERCHANT</h2>
      <div class="shard-hud big">&#9670; ${S.shards} shards</div>
      <div class="shop-list">${rows}</div>
      <button class="btn btn-big" id="shop-leave">LEAVE</button>
    </div>`;
  scr.querySelectorAll(".shop-buy:not([disabled])").forEach(b=>{
    b.onclick=async()=>{
      const s=node._stock[+b.dataset.i];
      if(s.bought||S.shards<s.price) return;
      S.shards-=s.price; s.bought=true; sfx.catch();
      if(s.charm) S.charms[s.key]=true;
      else if(s.trink) await gainTrinket(s.key);
      else giveItem(s.key,1);
      checkAchievements();
      renderShop(node);
    };
  });
  $("#shop-leave").onclick=()=>{ sfx.click(); completeNode(node); };
  show("shop");
}

  if(roll<0.67){ healTeamFrac(0.5); return "A clear stream lets your team drink and recover some HP."; }
  giveItem("potion",1); return "You stumble onto a traveler's stash: 1 Potion.";
}

function pickEvent(){
  if(!S.eventBag || !S.eventBag.length) S.eventBag=shuffle(EVENTS.map((_,i)=>i));
  const idx=S.eventBag.pop();
  return EVENTS[idx];
}
function doEvent(node){ renderEvent(pickEvent(), node); }

function renderEvent(ev,node){
  const scr=$("#scr-event");
  scr.innerHTML=`
    <div class="event-wrap panel">
      <div class="event-eyebrow">EVENT</div>
      <h2 class="event-title">${esc(ev.title)}</h2>
      <div class="event-text">${esc(ev.text)}</div>
      <div class="event-opts" id="event-opts"></div>
    </div>`;
  const opts=$("#event-opts");
  ev.opts.forEach(o=>{
    if(o.need && !o.need()) return;
    const b=el("button","btn event-opt",
      esc(o.label)+(o.cost?` <span class="opt-sub">(&#9670; ${o.cost})</span>`:""));
    b.onclick=async()=>{
      sfx.click();
      const out=await o.res();
      if(out && out.battle){ S.pendingNode=node; startBattle(out.battle); return; }
      const txt=(typeof out==="string")?out:(out&&out.text)||"";
      await eventResult(txt);
      completeNode(node);
    };
    opts.appendChild(b);
  });
  show("event");
}

function eventResult(text){
  return new Promise(res=>{
    const box=el("div","panel modal-box");
    box.appendChild(el("div","modal-sub",esc(text)));
    const b=el("button","btn","CONTINUE");
    b.onclick=()=>{ sfx.click(); closeModal(); res(); };
    box.appendChild(b);
    showModal(box);
  });
}
